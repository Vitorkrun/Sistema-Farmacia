<!DOCTYPE html>
<html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>FarmaEstoque</title>
<style>
:root{--bg:#EAF3FB;--card:#fff;--ink:#0F2A47;--mut:#5B7189;--line:#D3E2F1;--acc:#1565C0;--accd:#0A3D7A;--side:#0A2F5C;--pdv:#1B4F9C;--ok:#1B7F4B;--okbg:#DDF3E7;--warn:#9A5B00;--warnbg:#FFF0CC;--bad:#B3261E;--badbg:#FBE1DE}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.5 "Segoe UI",system-ui,sans-serif}
h1,h2{margin:0}h1{font-size:26px}h2{font-size:18px}.mut{color:var(--mut)}[hidden]{display:none!important}.r{text-align:right}
#app{display:grid;grid-template-columns:220px 1fr;min-height:100vh}
aside{background:var(--side);color:#DCEBFA;padding:20px 12px;display:flex;flex-direction:column;gap:3px}
.brand{display:flex;align-items:center;gap:9px;font-weight:700;font-size:20px;padding:0 8px 20px}
aside button{all:unset;cursor:pointer;padding:10px 12px;border-radius:9px;color:#A9C4E2}aside button:hover{background:#ffffff18}aside button.on{background:#fff;color:var(--accd);font-weight:600}
aside .sp{flex:1}.who{padding:8px 12px;font-size:13px;color:#8FB0D6}
main{padding:28px;max-width:1150px;width:100%}.top{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap;margin-bottom:20px}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:18px;margin-bottom:14px}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:14px;margin-bottom:14px}.grid .card{margin:0;border-top:4px solid var(--acc)}.grid b{display:block;font-size:26px}
.cols{display:grid;grid-template-columns:1fr 1fr;gap:14px}table{width:100%;border-collapse:collapse;font-size:14px}.wrap{overflow-x:auto}
th{text-align:left;color:var(--mut);padding:8px;border-bottom:2px solid var(--line);white-space:nowrap}td{padding:9px 8px;border-bottom:1px solid var(--line)}tbody tr:hover{background:#F2F8FE}
.tag{display:inline-block;padding:2px 10px;border-radius:99px;font-size:12px;font-weight:600}.ok{background:var(--okbg);color:var(--ok)}.warn{background:var(--warnbg);color:var(--warn)}.bad{background:var(--badbg);color:var(--bad)}
input,select{font:inherit;color:var(--ink);background:#fff;border:1px solid var(--line);border-radius:9px;padding:9px 11px;width:100%}input:focus,select:focus,.btn:focus-visible{outline:2px solid var(--acc);outline-offset:1px}
label{display:block;font-weight:500;font-size:13px;color:var(--mut)}label input,label select{margin-top:4px}
.btn{font:inherit;font-weight:600;cursor:pointer;border:1px solid var(--line);background:#fff;color:var(--ink);border-radius:9px;padding:9px 15px}.btn:hover{border-color:var(--acc)}
.btn.pri{background:var(--acc);border-color:var(--acc);color:#fff}.btn.pri:hover{background:var(--accd)}.btn.sm{padding:4px 10px;font-size:13px}.btn.del{color:var(--bad)}
.bar{display:flex;gap:10px;margin-bottom:12px;flex-wrap:wrap}.bar input{flex:1;min-width:200px}.bar select{width:auto}
.form{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:12px;align-items:end}.empty{text-align:center;padding:26px;color:var(--mut)}
dialog{border:1px solid var(--line);border-radius:16px;padding:22px;background:#fff;color:var(--ink);width:min(560px,94vw);box-shadow:0 20px 40px #0004}dialog::backdrop{background:#06203f99}

/* LOGIN */
#login{min-height:100vh}
.lroot{position:relative;min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:28px 18px 56px;overflow:hidden}
.lroot.prev{min-height:0;height:100%;padding:16px 16px 40px;pointer-events:none}
.lroot.pos-esquerda{align-items:flex-start;padding-left:min(8vw,90px)}.lroot.pos-direita{align-items:flex-end;padding-right:min(8vw,90px)}
.lbg{position:absolute;inset:-24px;background-size:cover;background-position:center}.lov{position:absolute;inset:0;background:#000;pointer-events:none}
.lcard{position:relative;width:min(var(--lc-largura),100%);background:var(--lc-cartao);color:var(--lc-texto);border-radius:var(--lc-raio);padding:30px 28px;box-shadow:0 14px 44px #0006;display:grid;gap:14px}
.lcl{text-align:center}.llogo-t{display:inline-flex;align-items:center;gap:9px;font-weight:700;font-size:22px}
.lcard h2{font-size:26px;text-align:center}.lsub{margin:-6px 0 0;text-align:center;opacity:.75;font-size:14px}
.lcard label{color:var(--lc-texto);opacity:.9;font-weight:600}.lcard input{background:#EEF3FB;border-color:#C9D6E8;color:#0F2A47;padding:11px 12px}
.lbtn{font:inherit;font-weight:600;border:0;cursor:pointer;background:var(--lc-botao);color:#fff;border-radius:max(calc(var(--lc-raio) - 4px),0px);padding:12px}.lbtn:hover{filter:brightness(.92)}
.llink{color:var(--lc-botao);font-size:13px;text-align:center;cursor:pointer;text-decoration:underline}
.lfoot{position:absolute;bottom:16px;left:0;right:0;text-align:center;color:var(--lc-rodape);font-size:13px;padding:0 16px}
#lprev{position:relative;height:500px;border:1px solid var(--line);border-radius:12px;overflow:hidden}
.tabs{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:14px}.tabs button{font:inherit;cursor:pointer;border:1px solid var(--line);background:#fff;color:var(--mut);border-radius:9px;padding:8px 14px;font-weight:600}.tabs button.on{background:var(--acc);border-color:var(--acc);color:#fff}
.fimg{display:grid;gap:6px;align-content:start}.fprev{background:#F2F6FB;border:1px dashed var(--line);border-radius:9px;padding:8px;min-height:60px;display:flex;align-items:center;justify-content:center}.fprev img{max-height:80px;max-width:100%}
.card h2{margin-bottom:2px}

#toast{position:fixed;left:50%;bottom:22px;transform:translateX(-50%);background:var(--accd);color:#fff;padding:12px 22px;border-radius:10px;opacity:0;pointer-events:none;transition:opacity .3s;z-index:999}#toast.on{opacity:1}
/* PDV */
#pdv{position:fixed;inset:0;z-index:50;background:#fff;display:flex;flex-direction:column;padding:10px 22px 8px;gap:10px}
.ph{display:flex;justify-content:space-between;align-items:center;font-weight:600;border-bottom:1px solid var(--line);padding-bottom:6px}.ph .x{all:unset;cursor:pointer;color:var(--mut);font-size:13px}
.pname{background:var(--pdv);color:#fff;font-size:30px;font-weight:700;padding:10px 22px;border-radius:10px;text-transform:uppercase;min-height:62px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pm{flex:1;display:grid;grid-template-columns:330px 1fr;gap:20px;min-height:0}.pl{display:flex;flex-direction:column;gap:6px}
.logo{height:150px;border-radius:24px;background:#fff;box-shadow:0 4px 18px #1b4f9c33;display:flex;align-items:center;justify-content:center;gap:15px;font-weight:800;color:var(--pdv);font-size:26px;margin-bottom:6px;overflow:hidden;padding:10px;}
.logo img{max-width:100%; max-height:100%; object-fit:contain;}
.logo-text { font-size: 22px; line-height: 1.2; text-align: left; color: var(--pdv); text-transform: uppercase;}
.pl label{font-weight:700;color:#333;font-size:13px;margin-top:2px}.pl input,.disp{background:#EEF1F5;border:1px solid #C9D1DC;border-radius:6px;padding:8px 10px;font-size:20px;font-weight:600;text-align:right;width:100%;min-height:42px}
#pc{text-align:left;background:#fff;border:2px solid var(--pdv)}
.tb{border:1px solid #bcc7d6;border-radius:6px;overflow:auto;min-height:0}.tb table{font-size:14px}.tb th{background:#F0F4F9;position:sticky;top:0;font-size:12px}.tb tr.sel{background:#D6E6FA}.tb td{padding:7px 8px}
.pb{display:grid;grid-template-columns:1fr 1fr;gap:20px;align-items:end}.cx{background:var(--pdv);color:#fff;border-radius:8px;font-size:38px;font-weight:700;text-align:center;padding:14px}
.sub{font-size:22px;font-weight:700;text-align:right}.st{background:var(--pdv);color:#fff;border-radius:8px;font-size:44px;font-weight:700;text-align:center;padding:10px}
.keys{display:flex;flex-wrap:wrap;gap:4px 22px;font-size:12px;color:#444}.keys b{color:var(--pdv)}
.pay{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}.pay label{cursor:pointer;text-align:center;border:2px solid var(--line);border-radius:10px;padding:10px 4px;color:var(--ink);font-weight:600;margin:0}.pay input{display:none}.pay label:has(input:checked){border-color:var(--acc);background:#E5F0FD;color:var(--accd)}
.big{background:var(--bg);padding:14px;border-radius:10px;text-align:center;font-size:34px;font-weight:700;color:var(--accd)}
#qr{display:block;margin:10px auto;width:260px;height:260px;image-rendering:pixelated}.cp{font:12px monospace;word-break:break-all;background:var(--bg);padding:8px;border-radius:8px}
@media print{body>*:not(#cupom){display:none!important}#cupom{display:block!important;font:12px monospace;width:280px}}
@media(max-width:860px){#app,#login,.pm,.cols{grid-template-columns:1fr}aside{flex-direction:row;flex-wrap:wrap}.pname{font-size:20px}}
</style></head><body>
<div id="login" hidden></div>
<div id="app" hidden><aside><div class="brand" id="lg1"></div>
<button data-v="painel">Painel</button><button id="bp">PDV / Caixa</button><button data-v="produtos">Produtos</button><button data-v="vendas">Vendas</button><button data-v="config">Configurações</button><button data-v="usuarios">Usuários</button>
<div class="sp"></div><button id="out">Sair</button><div class="who" id="who"></div></aside><main id="main"></main></div>
<div id="pdv" hidden></div><div id="cupom" hidden></div><dialog id="dlg"></dialog><div id="toast"></div>
<script>
const $=s=>document.querySelector(s),esc=s=>String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const brl=v=>Number(v||0).toLocaleString('pt-BR',{style:'currency',currency:'BRL'}),n3=v=>Number(v||0).toLocaleString('pt-BR',{minimumFractionDigits:3,maximumFractionDigits:3});
const dt=s=>new Date(s.replace(' ','T')).toLocaleString('pt-BR',{day:'2-digit',month:'2-digit',year:'2-digit',hour:'2-digit',minute:'2-digit'});
const FP={dinheiro:'Dinheiro',pix:'PIX',debito:'Cartão débito',credito:'Cartão crédito'};
const LOGO_ICON='<svg width="30" height="30" viewBox="0 0 32 32"><rect x="1" y="1" width="30" height="30" rx="9" fill="#fff"/><path d="M13 7h6v6h6v6h-6v6h-6v-6H7v-6h6z" fill="#1565C0"/></svg>';
let ME=null,P=[],CFG={},tt,CART=[],SEL=-1,LAST=null,TIMER;

function atualizarLogoMenu() {
    const nomeLoja = CFG.loja || 'FarmaEstoque';
    const logoHtml = CFG.logo ? `<img src="${CFG.logo}" style="max-height:30px; border-radius:4px; margin-right:5px;">` : LOGO_ICON;
    $('#lg1').innerHTML = logoHtml + nomeLoja;
    document.title = nomeLoja;
}

function salvarCarrinho(){localStorage.setItem('carrinho_salvo', JSON.stringify(CART))}
function carregarCarrinho(){try{const c=localStorage.getItem('carrinho_salvo');if(c){CART=JSON.parse(c);if(CART.length>0)SEL=0;draw();}}catch(e){}}

function toast(t){const e=$('#toast');e.textContent=t;e.className='on';clearTimeout(tt);tt=setTimeout(()=>e.className='',3200)}
async function api(path,o={}){const r=await fetch('/api/'+path,{method:o.m||'GET',headers:{'Content-Type':'application/json',Authorization:'Bearer '+(sessionStorage.getItem('t')||'')},body:o.b?JSON.stringify(o.b):undefined});
 const d=await r.json().catch(()=>({}));if(r.status===401&&!/^(login|primeiro|recuperar)/.test(path)){if(ME)sair();else sessionStorage.removeItem('t');throw new Error(d.erro)}if(!r.ok)throw new Error(d.erro||'Erro inesperado.');return d}
async function run(fn,ok){try{await fn();if(ok)toast(ok)}catch(e){toast(e.message)}}
const venc=p=>p.validade&&p.validade<new Date().toISOString().slice(0,10);

async function boot(){
    try { CFG=await api('config'); } catch(e){}
    if(sessionStorage.getItem('t')){try{ME=await api('me');return entrar()}catch(e){}}
    try{login((await api('status')).primeiro_acesso)}catch(e){document.body.innerHTML='<p style="padding:30px">Não foi possível falar com o servidor. Abra http://127.0.0.1:8000 com o servidor rodando.</p>'}
}

/* ---------- LOGIN (visual 100% editável em Configurações > Tela de login) ---------- */
const LDEF={login_titulo:'Entrar',login_subtitulo:'Acesse com seu usuário ou e-mail',login_rotulo_usuario:'Usuário ou e-mail',login_rotulo_senha:'Senha',login_botao:'Entrar',login_cor_botao:'#1565C0',login_cor_cartao:'#FFFFFF',login_cor_texto:'#0F2A47',login_cor_rodape:'#FFFFFF',login_raio:'10',login_largura:'400',login_posicao:'centro',login_mostrar_recuperar:'1',login_texto_recuperar:'Esqueci minha senha',login_escurecer:'0',login_desfoque:'0',login_logo_tam:'48',login_rodape:''};
const LV=(c,k)=>(c[k]!==undefined&&c[k]!==null&&c[k]!=='')?c[k]:LDEF[k];
const cor=(v,d)=>/^#[0-9a-f]{6}$/i.test(v||'')?v:d;
const nlim=(v,a,b,d)=>{v=Number(v);return isFinite(v)?Math.min(b,Math.max(a,v)):d};
const imgOk=v=>/^data:image\/(png|jpeg|webp|gif);base64,[A-Za-z0-9+\/=]+$/.test(v||'');
let LMODO='login',LINFO='',LEMAIL='';
function loginHTML(c,modo,prev){
  const nome=c.loja||'FarmaEstoque',logo=imgOk(c.login_logo)?c.login_logo:(imgOk(c.logo)?c.logo:''),bgc=cor(c.login_cor_fundo,''),fundo=imgOk(c.login_fundo)?c.login_fundo:'';
  const pos=['esquerda','direita'].includes(LV(c,'login_posicao'))?LV(c,'login_posicao'):'centro';
  const vars=`--lc-botao:${cor(LV(c,'login_cor_botao'),'#1565C0')};--lc-cartao:${cor(LV(c,'login_cor_cartao'),'#FFFFFF')};--lc-texto:${cor(LV(c,'login_cor_texto'),'#0F2A47')};--lc-raio:${nlim(LV(c,'login_raio'),0,40,10)}px;--lc-largura:${nlim(LV(c,'login_largura'),300,600,400)}px;--lc-rodape:${cor(LV(c,'login_cor_rodape'),'#FFFFFF')}`;
  const bg=bgc||'linear-gradient(160deg,#1565C0,#0A2F5C)',blur=nlim(LV(c,'login_desfoque'),0,20,0),esc_=nlim(LV(c,'login_escurecer'),0,90,0);
  const logoHtml=logo?`<img src="${esc(logo)}" alt="" style="max-height:${nlim(LV(c,'login_logo_tam'),20,160,48)}px;max-width:100%">`
    :`<span class="llogo-t">${LOGO_ICON.replace(/width="30" height="30"/,'width="38" height="38"').replace('fill="#1565C0"','style="fill:var(--lc-botao)"')}${esc(nome)}</span>`;
  const inp=(l,n,t,ex)=>`<label>${esc(l)}<input name="${n}" type="${t||'text'}" ${prev?'disabled':'required'} ${ex||''}></label>`;
  const voltar=`<a class="llink" ${prev?'':'href="#" onclick="mostrarLogin(\'login\');return false"'}>← Voltar ao login</a>`;
  let h2,sub,campos,btn,extra='';
  if(modo==='primeiro'){h2='Criar administrador';sub='Primeiro acesso: cadastre o administrador do sistema.';campos=inp('Usuário','nome')+inp('E-mail (usado para recuperar a senha)','email','email')+inp('Senha (mín. 4 caracteres)','senha','password','minlength="4"');btn='Criar e entrar'}
  else if(modo==='rec1'){h2='Recuperar senha';sub='Informe o e-mail de um administrador. Enviaremos um código de 6 dígitos.';campos=inp('E-mail do administrador','email','email');btn='Enviar código';extra=voltar}
  else if(modo==='rec2'){h2='Nova senha';sub=prev?'Digite o código enviado ao e-mail e escolha a nova senha.':LINFO;campos=inp('Código recebido','codigo','text','inputmode="numeric" maxlength="6" autocomplete="one-time-code"')+inp('Nova senha (mín. 4 caracteres)','senha','password','minlength="4"')+inp('Repita a nova senha','senha2','password');btn='Redefinir senha';extra=voltar}
  else{h2=LV(c,'login_titulo');sub=LV(c,'login_subtitulo');campos=inp(LV(c,'login_rotulo_usuario'),'nome','text','autocomplete="username"')+inp(LV(c,'login_rotulo_senha'),'senha','password','autocomplete="current-password"');btn=LV(c,'login_botao');
    if(LV(c,'login_mostrar_recuperar')!=='0')extra=`<a class="llink" ${prev?'':'href="#" onclick="mostrarLogin(\'rec1\');return false"'}>${esc(LV(c,'login_texto_recuperar'))}</a>`}
  const tag=prev?'div':'form',rod=LV(c,'login_rodape');
  return `<div class="lroot pos-${pos}${prev?' prev':''}" style="${vars};background:${bg}">${fundo?`<div class="lbg" style="background-image:url('${fundo}');${blur?`filter:blur(${blur}px)`:''}"></div>`:''}<div class="lov" style="opacity:${esc_/100}"></div>
  <${tag} ${prev?'':'id="lf"'} class="lcard"><div class="lcl">${logoHtml}</div><h2>${esc(h2)}</h2>${sub?`<p class="lsub">${esc(sub)}</p>`:''}${campos}<button class="lbtn" ${prev?'type="button"':''}>${esc(btn)}</button>${extra}</${tag}>
  ${rod?`<div class="lfoot">${esc(rod)}</div>`:''}</div>`}
function login(first){$('#app').hidden=true;$('#login').hidden=false;mostrarLogin(first?'primeiro':'login')}
function mostrarLogin(m){LMODO=m;$('#login').innerHTML=loginHTML(CFG,m,false);document.title=CFG.loja||'FarmaEstoque';const f=$('#lf');f.onsubmit=submitLogin;const i=f.querySelector('input');if(i)i.focus()}
async function submitLogin(e){e.preventDefault();const d=Object.fromEntries(new FormData(e.target));d.nome=(d.nome||'').trim();
  try{
    if(LMODO==='rec1'){const r=await api('recuperar/solicitar',{m:'POST',b:{email:d.email}});LEMAIL=(d.email||'').trim();
      LINFO=r.console?'Este servidor ainda não tem e-mail configurado: o código aparece na janela preta do servidor.':'Se o e-mail for de um administrador, enviamos um código (vale 15 minutos). Veja também a caixa de spam.';return mostrarLogin('rec2')}
    if(LMODO==='rec2'){if(d.senha!==d.senha2)return toast('As senhas não conferem.');await api('recuperar/confirmar',{m:'POST',b:{email:LEMAIL,codigo:d.codigo,senha:d.senha}});toast('Senha redefinida. Entre com a nova senha.');return mostrarLogin('login')}
    const r=await api(LMODO==='primeiro'?'primeiro-usuario':'login',{m:'POST',b:d});sessionStorage.setItem('t',r.token);ME=r.usuario;entrar()
  }catch(err){toast(err.message||'Erro ao entrar.')}}

async function entrar(){$('#login').hidden=true;$('#app').hidden=false;$('#who').textContent=ME.nome+' ('+ME.perfil+')';const adm=ME.perfil==='admin';document.querySelectorAll('aside [data-v="config"]').forEach(b=>b.hidden=!adm);try{CFG=await api('config');atualizarLogoMenu()}catch(e){}go('painel');if(adm&&!ME.email)setTimeout(()=>toast('Cadastre seu e-mail em Usuários para poder recuperar a senha.'),900)}
function sair(){sessionStorage.removeItem('t');ME=null;CART=[];localStorage.removeItem('carrinho_salvo');$('#pdv').hidden=true;boot()}
$('#out').onclick=sair;$('#bp').onclick=()=>abrirPDV();document.querySelectorAll('aside [data-v]').forEach(b=>b.onclick=()=>go(b.dataset.v));
const V={painel:vPainel,produtos:vProdutos,vendas:vVendas,relatorios:vRelatorios,config:vConfig,usuarios:vUsuarios};
async function go(v){
    if(v==='config'&&ME.perfil!=='admin')return toast('Somente administradores acessam as configurações.');
    const menuActive = (v === 'relatorios') ? 'vendas' : v;
    document.querySelectorAll('aside [data-v]').forEach(b=>b.classList.toggle('on',b.dataset.v===menuActive));
    try{$('#main').innerHTML=await V[v]();scrollTo(0,0);({produtos:linhas,vendas:ligarVendas,relatorios:ligarRelatorios,config:ligarCfg,usuarios:ligarUsers})[v]?.()}catch(e){toast(e.message)}
}
async function vPainel(){const r=await api('resumo');
 const li=(L,f)=>L.length?`<table>${L.map(f).join('')}</table>`:'<div class="empty">Nada por aqui. 👍</div>';
 return `<div class="top"><div><h1>Painel</h1><span class="mut">Resumo da farmácia hoje</span></div><button class="btn pri" onclick="abrirPDV()">Abrir caixa (PDV)</button></div>
 <div class="grid"><div class="card"><span class="mut">Vendas hoje</span><b>${brl(r.vendas_hoje)}</b><span class="mut">${r.n_hoje} venda(s)</span></div><div class="card"><span class="mut">Produtos cadastrados</span><b>${r.produtos}</b></div>
 <div class="card"><span class="mut">Estoque a preço de custo</span><b>${brl(r.custo)}</b></div></div>
 <div class="cols"><div class="card"><h2 style="margin-bottom:8px">Estoque baixo</h2>${li(r.baixos,p=>`<tr><td>${esc(p.nome)}</td><td class="r"><span class="tag ${p.estoque_atual?'warn':'bad'}">${p.estoque_atual} un</span></td></tr>`)}</div>
 <div class="card"><h2 style="margin-bottom:8px">Vencidos / vencendo em 90 dias</h2>${li(r.vencendo,p=>`<tr><td>${esc(p.nome)}</td><td class="r"><span class="tag ${p.validade<r.hoje?'bad':'warn'}">${p.validade.split('-').reverse().join('/')}</span></td></tr>`)}</div></div>`}
async function vProdutos(){P=await api('produtos');
 return `<div class="top"><div><h1>Produtos</h1><span class="mut">Cadastro, estoque e validade</span></div><div>${ME.perfil==='admin'&&!P.length?'<button class="btn" onclick="exemplo()">Carregar exemplos</button> ':''}<button class="btn pri" onclick="fProd()">Novo produto</button></div></div>

 <td class="r"><span class="tag ${p.estoque_atual<=0?'bad':p.estoque_atual<=p.estoque_minimo?'warn':'ok'}">${p.estoque_atual}</span></td><td>${p.validade?`<span class="tag ${venc(p)?'bad':'ok'}">${p.validade.split('-').reverse().join('/')}</span>`:'-'}</td>
 <td class="r" style="white-space:nowrap"><button class="btn sm" onclick="fProd(${p.id})">Editar</button>${ME.perfil==='admin'?` <button class="btn sm del" onclick="delProd(${p.id})">Excluir</button>`:''}</td></tr>`).join(''):'<tr><td colspan="6" class="empty">Nenhum produto.</td></tr>'};q.oninput=draw;draw()}
function exemplo(){run(async()=>{await api('produtos/exemplo',{m:'POST'});go('produtos')},'Produtos de exemplo carregados.')}
function fProd(id){const p=id?P.find(x=>x.id===id):{nome:'',codigo_barras:'',categoria:'',laboratorio:'',validade:'',receita:0,preco_compra:'',preco_venda:'',estoque_atual:0,estoque_minimo:5},d=$('#dlg');
 d.innerHTML=`<form id="pf" style="display:grid;gap:12px"><h2>${id?'Editar':'Novo'} produto</h2><label>Nome<input name="nome" required value="${esc(p.nome)}"></label>
 <div class="form"><label>Código de barras<input name="codigo_barras" value="${esc(p.codigo_barras)}"></label><label>Categoria<input name="categoria" value="${esc(p.categoria)}" placeholder="Medicamentos, Higiene..."></label><label>Laboratório<input name="laboratorio" value="${esc(p.laboratorio)}"></label><label>Validade<input name="validade" type="date" value="${esc(p.validade)}"></label></div>
 <div class="form"><label>Preço de compra<input name="preco_compra" type="number" step="0.01" min="0" required value="${p.preco_compra}"></label><label>Preço de venda<input name="preco_venda" type="number" step="0.01" min="0" required value="${p.preco_venda}"></label><label>Estoque atual<input name="estoque_atual" type="number" min="0" required value="${p.estoque_atual}"></label><label>Estoque mínimo<input name="estoque_minimo" type="number" min="0" required value="${p.estoque_minimo}"></label></div>
 <label style="display:flex;gap:8px;align-items:center"><input type="checkbox" name="receita" style="width:auto" ${p.receita?'checked':''}> Exige receita (tarja vermelha/preta)</label>
 <div style="display:flex;gap:8px;justify-content:flex-end"><button type="button" class="btn" onclick="$('#dlg').close()">Cancelar</button><button class="btn pri">Salvar</button></div></form>`;d.showModal();
 $('#pf').onsubmit=e=>{e.preventDefault();const b=Object.fromEntries(new FormData(e.target));b.receita=e.target.receita.checked?1:0;run(async()=>{await api('produtos'+(id?'/'+id:''),{m:id?'PUT':'POST',b});d.close();go('produtos')},'Produto salvo.')}}
function delProd(id){if(confirm('Excluir este produto?'))run(async()=>{await api('produtos/'+id,{m:'DELETE'});go('produtos')},'Produto excluído.')}

            Atendente: ${esc(v.operador)}<br>
            Pagamento: ${FP[v.forma]}<hr>
            ${itens.map(i => `${esc(i.nome)}<br>&nbsp;${i.qtd} x ${brl(i.preco)} = ${brl(i.preco * i.qtd)}<br>`).join('')}
            <hr><b>TOTAL ${brl(v.total)}</b><br>
            ${v.forma === 'dinheiro' ? `Recebido ${brl(v.pago)} · Troco ${brl(v.troco)}<hr>` : ''}

        `;

        d.innerHTML = `
            <div style="font-family: monospace; font-size: 13px; line-height: 1.4; color: #333;">
                <div style="text-align:center; margin-bottom: 12px;">
                    <div style="font-size: 16px; font-weight: bold; color: #0F2A47;">${esc(CFG.loja || 'FARMÁCIA')}</div>
                    <div style="font-size: 11px; color: #666;">*** CUPOM NÃO FISCAL ***</div>
                </div>
                
                <div style="border-top: 1px dashed #ccc; border-bottom: 1px dashed #ccc; padding: 6px 0; margin-bottom: 8px; font-size: 12px;">
                    <div style="display:flex; justify-content:space-between;"><span>Venda:</span> <b>${v.id}</b></div>
                    <div style="display:flex; justify-content:space-between;"><span>Data:</span> <b>${dt(v.data)}</b></div>
                    <div style="display:flex; justify-content:space-between;"><span>Operador:</span> <b>${esc(v.operador)}</b></div>
                    <div style="display:flex; justify-content:space-between;"><span>Pagamento:</span> <b>${FP[v.forma]}</b></div>
                </div>

                <table style="width: 100%; font-size: 12px; margin-bottom: 8px;">
                    <thead>
                        <tr style="border-bottom: 1px solid #ddd;">
                            <th style="text-align:left; padding-bottom:4px;">Produto</th>
                            <th style="text-align:center; padding-bottom:4px;">Qtd</th>
                            <th style="text-align:right; padding-bottom:4px;">Total</th>
                        </tr>
                    </thead>
                    <tbody>
                        ${itens.map(i => `
                            <tr>
                                <td style="padding: 4px 0;">${esc(i.nome)}</td>
                                <td style="text-align:center; padding: 4px 0;">${i.qtd}</td>
                                <td style="text-align:right; padding: 4px 0;">${brl(i.preco * i.qtd)}</td>
                            </tr>

                    </tbody>
                </table>

                <div style="border-top: 1px dashed #ccc; padding-top: 6px; margin-top: 6px;">
                    <div style="display:flex; justify-content:space-between; font-weight:bold; font-size: 15px; color: #0F2A47;">
                        <span>TOTAL</span>
                        <span>${brl(v.total)}</span>
                    </div>
                    ${v.forma === 'dinheiro' ? `
                        <div style="display:flex; justify-content:space-between; font-size: 12px; color: #555; margin-top: 4px;">
                            <span>Valor Recebido</span>
                            <span>${brl(v.pago)}</span>
                        </div>
                        <div style="display:flex; justify-content:space-between; font-size: 12px; color: #555;">
                            <span>Troco</span>
                            <span>${brl(v.troco)}</span>
                        </div>
                    ` : ''}

            </div>
            <div style="display:flex; gap:8px; justify-content:space-between; margin-top:20px;">
                <button class="btn" onclick="window.print()">Imprimir Cupom</button>
                <button class="btn pri" onclick="$('#dlg').close()">Fechar</button>
            </div>
        `;
    } catch(e) {
        d.innerHTML = `<div class="empty">Erro: ${e.message}</div><div class="r" style="margin-top:10px"><button class="btn" onclick="$('#dlg').close()">Fechar</button></div>`;
    }

async function vRelatorios(){
    const h=new Date().toISOString().slice(0,10);
    return `<div class="top">
        <div><h1>Relatórios</h1><span class="mut">Exportação e análise de vendas</span></div>
        <div style="display:flex; gap:10px;">
            <button class="btn" onclick="go('vendas')">Voltar para Vendas</button>
            <button class="btn pri" id="btn-export" style="display:none;">Exportar CSV</button>
        </div>
    </div>
    <div class="card"><div class="bar">
        <label style="flex:1">De<input type="date" id="ri" value="${h.slice(0,8)}01"></label>
        <label style="flex:1">Até<input type="date" id="rf" value="${h}"></label>
        <button class="btn pri" id="rb" style="align-self:flex-end">Gerar Relatório</button>
    </div></div><div id="res_relatorio"></div>`;
}

function ligarRelatorios(){
    const f=()=>run(async()=>{
        const ini = $('#ri').value, fim = $('#rf').value;
        const r = await api(`vendas?ini=${ini}&fim=${fim}`);
        
        let html = `<div class="grid">
            <div class="card"><span class="mut">Total Vendido</span><b>${brl(r.total)}</b></div>
            <div class="card"><span class="mut">Lucro Bruto</span><b>${brl(r.lucro)}</b></div>
            <div class="card"><span class="mut">Qtd. Vendas</span><b>${r.n}</b></div>
        </div>`;

        if(r.n > 0) {
            $('#btn-export').style.display = 'inline-block';
            $('#btn-export').onclick = () => {
                let csv = "ID;Data;Operador;Pagamento;Total\n";
                r.vendas.forEach(v => {
                    csv += `${v.id};${dt(v.data)};${v.operador};${FP[v.forma]};${v.total.toFixed(2).replace('.',',')}\n`;
                });
                const blob = new Blob(["\uFEFF"+csv], {type: 'text/csv;charset=utf-8;'});
                const url = URL.createObjectURL(blob);
                const a = document.createElement("a");
                a.href = url;
                a.download = `relatorio_vendas_${ini}_a_${fim}.csv`;
                a.click();
                URL.revokeObjectURL(url);
            };

            html += `<div class="card wrap">
                <table>
                    <thead><tr><th>Nº</th><th>Data</th><th>Operador</th><th>Pagamento</th><th class="r">Total</th></tr></thead>
                    <tbody>
                        ${r.vendas.map(v => `<tr><td>${v.id}</td><td class="mut">${dt(v.data)}</td><td>${esc(v.operador)}</td><td>${FP[v.forma]}</td><td class="r"><b>${brl(v.total)}</b></td></tr>`).join('')}
                    </tbody>
                </table>
            </div>`;
        } else {
            $('#btn-export').style.display = 'none';
            html += '<div class="empty">Nenhuma venda no período selecionado.</div>';
        }

        $('#res_relatorio').innerHTML = html;
    });
    $('#rb').onclick = f; f();
}

const secao=(t,d,corpo)=>`<div class="card"><h2>${t}</h2><p class="mut" style="margin:2px 0 14px">${d}</p>${corpo}</div>`;
const fTxt=(l,n,ex)=>`<label>${l}<input name="${n}" value="${esc(CFG[n]||'')}" ${ex||''}></label>`;
const fCor=(l,n)=>`<label>${l}<input type="color" name="${n}" value="${cor(LV(CFG,n),'#000000')}" style="height:42px;padding:3px"></label>`;
const fNum=(l,n,a,b,u)=>`<label>${l}: <b data-out="${n}">${LV(CFG,n)}</b> ${u}<input type="range" name="${n}" min="${a}" max="${b}" value="${LV(CFG,n)}" style="padding:0;height:30px"></label>`;
const fSel=(l,n,o,v)=>`<label>${l}<select name="${n}">${o.map(([k,t])=>`<option value="${k}" ${String(v)===k?'selected':''}>${t}</option>`).join('')}</select></label>`;
const fImg=(l,n,max,mime,dica)=>`<div class="fimg"><label>${l}<input type="file" accept="image/*" data-img="${n}" data-max="${max}" data-mime="${mime}"></label><input type="hidden" name="${n}" value="${esc(CFG[n]||'')}"><div class="fprev" data-prev="${n}">${CFG[n]?`<img src="${esc(CFG[n])}" alt="">`:'<span class="mut">Nenhuma imagem</span>'}</div>${dica?`<span class="mut" style="font-size:12px">${dica}</span>`:''}<button type="button" class="btn sm" data-rm="${n}">Remover imagem</button></div>`;
const G2='class="form" style="grid-template-columns:repeat(auto-fit,minmax(240px,1fr))"';
function lerImg(file,max,mime,q){return new Promise((ok,no)=>{const r=new FileReader();r.onerror=()=>no(new Error('Não foi possível ler a imagem.'));r.onload=e=>{const im=new Image();im.onerror=()=>no(new Error('Imagem inválida.'));im.onload=()=>{const s=Math.min(1,max/Math.max(im.width,im.height)),w=Math.round(im.width*s),h=Math.round(im.height*s),cv=document.createElement('canvas');cv.width=w;cv.height=h;cv.getContext('2d').drawImage(im,0,0,w,h);ok(cv.toDataURL(mime,q))};im.src=e.target.result};r.readAsDataURL(file)})}
const CPANES={loja:cpLoja,pix:cpPix,login:cpLogin,email:cpEmail};let CTAB='loja';
async function vConfig(){CFG=await api('config');return `<div class="top"><div><h1>Configurações</h1><span class="mut">Visível somente para administradores</span></div></div>
 <div class="tabs" id="ctabs">${[['loja','Loja'],['pix','PIX'],['login','Tela de login'],['email','E-mail e recuperação de senha']].map(([k,n])=>`<button data-t="${k}">${n}</button>`).join('')}</div><div id="cpane"></div>`}
function ligarCfg(){document.querySelectorAll('#ctabs button').forEach(b=>b.onclick=()=>abrirAba(b.dataset.t));abrirAba(CTAB)}
async function abrirAba(t){CTAB=t;document.querySelectorAll('#ctabs button').forEach(b=>b.classList.toggle('on',b.dataset.t===t));try{$('#cpane').innerHTML=await CPANES[t]();ligarAba(t)}catch(e){toast(e.message)}}
function setImg(n,v){const f=document.querySelector(`#cpane [name="${n}"]`);f.value=v;document.querySelector(`#cpane [data-prev="${n}"]`).innerHTML=v?`<img src="${v}" alt="">`:'<span class="mut">Nenhuma imagem</span>';f.form.dispatchEvent(new Event('input'))}
function ligarAba(t){
  document.querySelectorAll('#cpane [data-img]').forEach(i=>i.onchange=async()=>{const f=i.files[0];if(!f)return;try{setImg(i.dataset.img,await lerImg(f,+i.dataset.max,i.dataset.mime,.82))}catch(e){toast(e.message)}});
  document.querySelectorAll('#cpane [data-rm]').forEach(b=>b.onclick=()=>setImg(b.dataset.rm,''));
  document.querySelectorAll('#cpane form.cf').forEach(f=>{f.oninput=f.onchange=()=>{f.querySelectorAll('[data-out]').forEach(s=>s.textContent=f.elements[s.dataset.out].value);if(t==='login')previa()};f.onsubmit=ev=>{ev.preventDefault();salvarSecao(f)}});
  if(t==='login'){$('#pmodo').onchange=previa;$('#lrestaurar').onclick=restaurarLogin;previa()}
  if(t==='email')$('#teste_btn').onclick=()=>run(async()=>{await api('config/testar-email',{m:'POST',b:{para:$('#teste_para').value}})},'E-mail de teste enviado.');
}
function salvarSecao(f){run(async()=>{const d=Object.fromEntries(new FormData(f));if(f.dataset.sec==='login'&&d._fundo_tipo!=='solida')d.login_cor_fundo='';delete d._fundo_tipo;await api('config',{m:'POST',b:d});CFG=await api('config');atualizarLogoMenu()},'Configurações salvas.')}
function previa(){const f=document.querySelector('#cpane form.cf');if(!f)return;const d=Object.fromEntries(new FormData(f));if(d._fundo_tipo!=='solida')d.login_cor_fundo='';$('#lprev').innerHTML=loginHTML({...CFG,...d},$('#pmodo').value,true)}
function restaurarLogin(){if(!confirm('Voltar a tela de login ao visual padrão? (Loja e logo da loja não mudam.)'))return;run(async()=>{const b={login_fundo:'',login_cor_fundo:'',login_logo:''};Object.keys(LDEF).forEach(k=>b[k]='');await api('config',{m:'POST',b});await abrirAba('login')},'Visual padrão restaurado.')}
